name: Daily auto post (X & Instagram)

# 毎日 07:00 JST (22:00 UTC) に1記事ずつ自動投稿する。
# 手動実行(workflow_dispatch)でテストも可能。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # 1) 次の記事のカード画像を生成
      - name: Render card
        id: render
        run: node scripts/render.mjs

      # 2) 画像をコミット＆push（Instagramが参照する公開URLを先に用意）
      - name: Commit card image
        run: |
          git config user.name "kakusei-bot"
          git config user.email "actions@github.com"
          git add output/cards
          git diff --cached --quiet || git commit -m "card: ${{ steps.render.outputs.post_id }}"
          git push origin HEAD:${{ github.ref_name }}

      # 3) X と Instagram に投稿
      - name: Post to X & Instagram
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/post-next.mjs

      # 4) 投稿状態(state.json)をコミット＆push
      - name: Commit state
        run: |
          git add content/state.json
          git diff --cached --quiet || git commit -m "state: posted update"
          git push origin HEAD:${{ github.ref_name }}
